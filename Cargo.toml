[package]
name = "steamlite"
version = "0.1.0"
edition = "2021"
description = "Lightweight native launcher for installed Steam games"
license = "MIT"
rust-version = "1.83"

[lib]
name = "steamlite"
path = "src/lib.rs"

[[bin]]
name = "steamlite"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_16"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
