app-id: io.github.plaintextlab.steamlite
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: steamlite
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Steam's files and libraries can live anywhere (~/.local/share/Steam,
  # ~/.steam, /media/..., /mnt/...); steamlite only reads them.
  - --filesystem=host:ro
  # config.toml and style.css stay in the usual place.
  - --filesystem=xdg-config/steamlite:create
  # Start and detect the host Steam client via flatpak-spawn --host.
  - --talk-name=org.freedesktop.Flatpak
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/steamlite/cargo
  # Local bundle builds fetch crates during the build. For Flathub this would
  # be replaced by flatpak-cargo-generator output.
  build-args:
    - --share=network
modules:
  - name: steamlite
    buildsystem: simple
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/steamlite /app/bin/steamlite
      - install -Dm644 data/steamlite.desktop /app/share/applications/io.github.plaintextlab.steamlite.desktop
      - desktop-file-edit --set-icon=io.github.plaintextlab.steamlite /app/share/applications/io.github.plaintextlab.steamlite.desktop
      - install -Dm644 data/steamlite.svg /app/share/icons/hicolor/scalable/apps/io.github.plaintextlab.steamlite.svg
      - install -Dm644 data/io.github.plaintextlab.steamlite.metainfo.xml /app/share/metainfo/io.github.plaintextlab.steamlite.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - dist
          - packaging/.build
